name: update-prices

on:
  schedule:
    - cron: "30 7 * * 1-5"   # 평일 한국시간 16:30 (장 마감 후)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 주가 받아오기
        run: python tools/update_prices.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || (git commit -m "update prices" && git push)
